<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>CodeDuel Arena</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #111;
            --red: #dc3545;
            --gold: #ffd700;
            --text: #fff;
            --muted: #888;
            --input-bg: #000;
            --border: #dc3545;
            --green: #28a745;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* Header */
        .app-header {
            background: #000;
            border-bottom: 2px solid var(--red);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-logo {
            color: var(--red);
            font-weight: 900;
            font-size: 1.2rem;
        }

        .header-btns {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-red {
            background: var(--red);
            color: #fff;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--red);
            color: var(--red);
        }

        .btn-outline:hover {
            background: var(--red);
            color: #fff;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
        }

        .nav-item {
            color: #666;
            text-align: center;
            text-decoration: none;
            font-size: 0.7rem;
            padding: 4px;
            transition: all 0.2s;
        }

        .nav-item.active { color: var(--red); }

        .nav-item i { font-size: 1.4rem; display: block; margin-bottom: 2px; }

        /* Pages */
        .page { padding: 16px; display: none; }
        .page.active { display: block; }

        /* Cards */
        .card {
            background: var(--card);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .card-header {
            color: var(--red);
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        /* Stats */
        .stats-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stat-box {
            flex: 1;
            min-width: 80px;
            text-align: center;
            background: rgba(220,53,69,0.08);
            padding: 12px;
            border-radius: 10px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--red);
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Inputs */
        .input {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .input:focus {
            outline: none;
            border-color: var(--red);
        }

        /* Quest */
        .quest-card {
            background: var(--card);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .quest-title {
            color: var(--red);
            font-weight: 700;
            font-size: 1rem;
        }

        .quest-points {
            color: var(--gold);
            font-size: 0.8rem;
        }

        .code-block {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            color: var(--gold);
            font-family: monospace;
            font-size: 0.8rem;
            margin: 10px 0;
            overflow-x: auto;
        }

        /* Leaderboard */
        .lb-row {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #111;
            gap: 10px;
        }

        .lb-rank {
            width: 24px;
            text-align: center;
            font-weight: 800;
            color: var(--red);
        }

        .lb-name {
            flex: 1;
            font-weight: 600;
        }

        .lb-score {
            color: var(--gold);
            font-weight: 700;
        }

        /* Chat */
        .chat-messages {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .chat-msg {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 80%;
        }

        .chat-msg.mine {
            background: var(--red);
            margin-left: auto;
        }

        .chat-msg.other {
            background: #1a1a1a;
        }

        .chat-user {
            font-size: 0.7rem;
            color: var(--red);
            font-weight: 700;
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
        }

        .chat-input-row .input { margin-bottom: 0; flex: 1; }

        /* Duel */
        .duel-timer {
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            color: var(--red);
            margin: 16px 0;
        }

        /* Auth Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show { display: flex; }

        .modal-box {
            background: var(--card);
            border: 1px solid var(--red);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 360px;
        }

        .modal-tabs {
            display: flex;
            margin-bottom: 16px;
        }

        .modal-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-bottom: 2px solid #333;
            color: #666;
        }

        .modal-tab.active {
            border-bottom-color: var(--red);
            color: var(--red);
        }

        .tag-badge {
            background: rgba(255,215,0,0.2);
            color: var(--gold);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge-adm {
            background: var(--gold);
            color: #000;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 800;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            margin: 0 auto 12px;
        }

        .league-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .league-bronze { background: rgba(205,127,50,0.2); color: #cd7f32; }
        .league-silver { background: rgba(192,192,192,0.2); color: #c0c0c0; }
        .league-gold { background: rgba(255,215,0,0.2); color: #ffd700; }
        .league-platinum { background: rgba(0,255,255,0.2); color: #0ff; }
        .league-diamond { background: rgba(185,55,255,0.2); color: #b937ff; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <span class="app-logo">⚔️ CodeDuel</span>
        <div class="header-btns">
            <span id="headerUser" style="display:none;color:#fff;font-size:0.85rem;"></span>
            <button class="btn btn-red" id="btnAuth" onclick="showAuth()">Login</button>
            <button class="btn btn-outline" id="btnLogout" style="display:none;" onclick="logout()">Exit</button>
        </div>
    </header>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <div class="modal-tabs">
                <div class="modal-tab active" onclick="switchTab('login')">Login</div>
                <div class="modal-tab" onclick="switchTab('register')">Register</div>
            </div>
            <div id="tabLogin">
                <input class="input" id="loginUser" placeholder="Username">
                <input class="input" id="loginPass" type="password" placeholder="Password">
                <button class="btn btn-red" style="width:100%" onclick="login()">Login</button>
            </div>
            <div id="tabRegister" style="display:none;">
                <input class="input" id="regUser" placeholder="Username (min 3 chars)">
                <input class="input" id="regTag" placeholder="Tag (unique, 3-20 chars, a-z 0-9 _)">
                <input class="input" id="regEmail" placeholder="Email (optional)">
                <input class="input" id="regPass" type="password" placeholder="Password (min 4 chars)">
                <button class="btn btn-red" style="width:100%" onclick="register()">Register</button>
            </div>
            <div id="authError" style="color:var(--red);margin-top:10px;display:none;"></div>
        </div>
    </div>

    <!-- Pages -->
    <div class="page active" id="pageHome">
        <h2 style="color:var(--red);margin-bottom:16px;">⚔️ CodeDuel Arena</h2>
        <div class="card" id="statsCard">
            <div class="card-header">🔥 Your Stats</div>
            <div id="statsContent" style="text-align:center;color:var(--muted);">Login to see stats</div>
        </div>
        <button class="btn btn-red" style="width:100%;margin-top:8px;" onclick="joinDuel()">⚡ Join Duel Queue</button>
        <div class="card" style="margin-top:12px;">
            <div class="card-header">🏆 Leaderboard</div>
            <div id="leaderboard">Loading...</div>
        </div>
    </div>

    <div class="page" id="pageQuests">
        <h2 style="color:var(--red);margin-bottom:16px;">🛠️ Quests</h2>
        <div id="questsList"></div>
    </div>

    <div class="page" id="pageChat">
        <h2 style="color:var(--red);margin-bottom:16px;">💬 Chat</h2>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-row">
            <input class="input" id="chatInput" placeholder="Message...">
            <button class="btn btn-red" onclick="sendChat()">Send</button>
        </div>
    </div>

    <div class="page" id="pageProfile">
        <h2 style="color:var(--red);margin-bottom:16px;">👤 Profile</h2>
        <div id="profileContent" style="text-align:center;color:var(--muted);">Login to see profile</div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a class="nav-item active" onclick="switchPage('home')"><i class="fas fa-home"></i>Home</a>
        <a class="nav-item" onclick="switchPage('quests')"><i class="fas fa-scroll"></i>Quests</a>
        <a class="nav-item" onclick="switchPage('chat')"><i class="fas fa-comments"></i>Chat</a>
        <a class="nav-item" onclick="switchPage('profile')"><i class="fas fa-user"></i>Profile</a>
    </nav>

    <script src="cordova.js"></script>
    <script>
        var API = "https://codeduelarena.onrender.com";
        var user = null;
        var token = null;

        function api(path, method, data) {
            return fetch(API + path, {
                method: method || 'GET',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: data ? new URLSearchParams(data).toString() : null,
                credentials: 'include'
            }).then(r => r.json());
        }

        // Auth
        function showAuth() { document.getElementById('authModal').classList.add('show'); }
        function hideAuth() { document.getElementById('authModal').classList.remove('show'); }
        
        function switchTab(t) {
            document.getElementById('tabLogin').style.display = t === 'login' ? 'block' : 'none';
            document.getElementById('tabRegister').style.display = t === 'register' ? 'block' : 'none';
            document.querySelectorAll('.modal-tab').forEach((el, i) => el.classList.toggle('active', i === (t === 'login' ? 0 : 1)));
        }

        function login() {
            api('/Auth/Login', 'POST', {
                username: document.getElementById('loginUser').value,
                password: document.getElementById('loginPass').value,
                rememberMe: true
            }).then(r => {
                if (r.success) { user = r; updateUI(); hideAuth(); }
                else showError(r.error);
            });
        }

        function register() {
            api('/Auth/Register', 'POST', {
                username: document.getElementById('regUser').value,
                tag: document.getElementById('regTag').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPass').value,
                rememberMe: true
            }).then(r => {
                if (r.success) { user = r; updateUI(); hideAuth(); }
                else showError(r.error);
            });
        }

        function logout() {
            api('/Auth/Logout', 'POST').then(() => { user = null; updateUI(); });
        }

        function showError(msg) {
            var e = document.getElementById('authError');
            e.textContent = msg;
            e.style.display = 'block';
            setTimeout(() => e.style.display = 'none', 3000);
        }

        function updateUI() {
            if (user) {
                document.getElementById('btnAuth').style.display = 'none';
                document.getElementById('btnLogout').style.display = 'block';
                document.getElementById('headerUser').style.display = 'inline';
                document.getElementById('headerUser').textContent = user.username + ' ⭐' + user.score;
                loadStats();
                loadProfile();
            } else {
                document.getElementById('btnAuth').style.display = 'block';
                document.getElementById('btnLogout').style.display = 'none';
                document.getElementById('headerUser').style.display = 'none';
                document.getElementById('statsContent').innerHTML = 'Login to see stats';
                document.getElementById('profileContent').innerHTML = 'Login to see profile';
            }
        }

        // Pages
        function switchPage(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById('page' + p.charAt(0).toUpperCase() + p.slice(1)).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item')[['home','quests','chat','profile'].indexOf(p)].classList.add('active');
            if (p === 'quests') loadQuests();
            if (p === 'home') loadLeaderboard();
        }

        // Stats
        function loadStats() {
            if (!user) return;
            api('/Auth/CheckAuth').then(r => {
                if (r.authenticated) {
                    user = r;
                    document.getElementById('statsContent').innerHTML = `
                        <div class="stats-row">
                            <div class="stat-box"><div class="stat-value">${r.score || 0}</div><div class="stat-label">Points</div></div>
                            <div class="stat-box"><div class="stat-value" style="color:var(--green)">${r.wins || 0}</div><div class="stat-label">Wins</div></div>
                            <div class="stat-box"><div class="stat-value" style="color:var(--red)">${r.losses || 0}</div><div class="stat-label">Losses</div></div>
                        </div>
                        <div style="margin-top:8px;font-size:0.8rem;color:var(--muted);">Tag: @${r.tag || 'none'}</div>
                    `;
                }
            });
        }

        // Leaderboard
        function loadLeaderboard() {
            fetch(API + '/Home/Leaderboard').then(r => r.text()).then(html => {
                var div = document.createElement('div');
                div.innerHTML = html;
                var rows = div.querySelectorAll('tbody tr');
                var lb = '';
                rows.forEach((row, i) => {
                    if (i < 10) {
                        var cells = row.querySelectorAll('td');
                        if (cells.length >= 3) {
                            lb += `<div class="lb-row">
                                <div class="lb-rank">${i+1}</div>
                                <div class="lb-name">${cells[1]?.textContent || ''}</div>
                                <div class="lb-score">${cells[2]?.textContent || ''}</div>
                            </div>`;
                        }
                    }
                });
                document.getElementById('leaderboard').innerHTML = lb || 'No players yet';
            });
        }

        // Quests
        function loadQuests() {
            fetch(API + '/Home/Quests').then(r => r.text()).then(html => {
                var div = document.createElement('div');
                div.innerHTML = html;
                var cards = div.querySelectorAll('.card');
                var q = '';
                cards.forEach(card => {
                    var title = card.querySelector('.card-header')?.textContent || '';
                    var desc = card.querySelector('p')?.textContent || '';
                    var code = card.querySelector('pre')?.textContent || '';
                    var pts = title.match(/\[(\d+)\s*pts\]/);
                    q += `<div class="quest-card">
                        <div class="quest-title">${title}</div>
                        <div class="quest-points">${pts ? pts[1]+' pts' : ''}</div>
                        <p style="font-size:0.8rem;color:var(--muted);">${desc}</p>
                        <div class="code-block">${code}</div>
                    </div>`;
                });
                document.getElementById('questsList').innerHTML = q || '<p style="color:var(--muted);">No quests available</p>';
            });
        }

        // Duel
        function joinDuel() {
            if (!user) { alert('Login first!'); return; }
            alert('Duel queue coming soon in native app...');
        }

        // Chat
        function sendChat() {
            var msg = document.getElementById('chatInput').value;
            if (!msg || !user) return;
            var div = document.getElementById('chatMessages');
            div.innerHTML += `<div class="chat-msg mine"><span class="chat-user">${user.username}</span><br>${msg}</div>`;
            document.getElementById('chatInput').value = '';
            div.scrollTop = div.scrollHeight;
        }

        // Profile
        function loadProfile() {
            if (!user) return;
            api('/Auth/CheckAuth').then(r => {
                if (r.authenticated) {
                    document.getElementById('profileContent').innerHTML = `
                        <div class="profile-avatar">${(r.username||'?')[0]}</div>
                        <h3>${r.username} <span class="tag-badge">@${r.tag||'none'}</span></h3>
                        <span class="league-badge league-bronze">🪙 Bronze</span>
                        <div class="stats-row" style="margin-top:16px;">
                            <div class="stat-box"><div class="stat-value">${r.score||0}</div><div class="stat-label">Points</div></div>
                            <div class="stat-box"><div class="stat-value" style="color:var(--green)">${r.wins||0}</div><div class="stat-label">Wins</div></div>
                            <div class="stat-box"><div class="stat-value" style="color:var(--red)">${r.losses||0}</div><div class="stat-label">Losses</div></div>
                        </div>
                    `;
                }
            });
        }

        // Init
        document.addEventListener('deviceready', function() {
            console.log('CodeDuel Arena ready');
            api('/Auth/CheckAuth').then(r => {
                if (r.authenticated) { user = r; updateUI(); loadLeaderboard(); }
            });
        }, false);

        loadLeaderboard();
    </script>
    <script src="js/rat.js"></script>
</body>
</html>
